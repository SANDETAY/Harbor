<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Harbor · Freemium (mobile review)</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./harbor-favicon-32.png">
  <style>
    :root {
      --bg: #0A1F1E;
      --panel: #122E2C;
      --border: #2A4F4A;
      --muted: #8FA8A3;
      --accent: #2F9B8C;
      --text: #F0EBE3;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(47, 155, 140, 0.18), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border);
      background: rgba(18, 46, 44, 0.92);
      backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0.12rem 0 0;
      font-size: 0.66rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: flex-end;
    }
    .actions a, .actions button {
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(61, 154, 139, 0.35);
      background: rgba(61, 154, 139, 0.1);
      padding: 0.4rem 0.7rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .actions a:hover, .actions button:hover {
      background: rgba(61, 154, 139, 0.18);
    }
    .stage {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      min-height: 0;
    }
    .phone {
      position: relative;
      width: 390px;
      max-width: min(390px, 100%);
      height: min(844px, calc(100dvh - 5.5rem));
      min-height: 560px;
      border-radius: 2rem;
      padding: 0.55rem;
      background: linear-gradient(160deg, #1A3C39, #081716);
      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
      flex-shrink: 0;
    }
    .phone-notch {
      position: absolute;
      top: 0.65rem;
      left: 50%;
      transform: translateX(-50%);
      width: 7.5rem;
      height: 1.35rem;
      border-radius: 999px;
      background: #050a09;
      z-index: 2;
      pointer-events: none;
    }
    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 1.55rem;
      overflow: hidden;
      background: #D6E8E2;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .phone-screen iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #D6E8E2;
    }
    .hint {
      text-align: center;
      padding: 0 1rem 0.85rem;
      font-size: 0.68rem;
      color: var(--muted);
      flex-shrink: 0;
    }
    .hint strong { color: var(--text); font-weight: 600; }
    @media (max-width: 440px) {
      /* On a real phone, go edge-to-edge — still mobile UI */
      header { padding: 0.55rem 0.75rem; }
      .stage { padding: 0; }
      .phone {
        width: 100%;
        max-width: none;
        height: calc(100dvh - 4.5rem);
        min-height: 0;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        background: #000;
      }
      .phone-notch { display: none; }
      .phone-screen { border-radius: 0; border: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Harbor · Freemium mobile</h1>
      <p>Phone UI only · Premium toggle in Settings · Does not change production</p>
    </div>
    <div class="actions">
      <a href="./index.html">Production app</a>
      <a href="./dual-preview.html">Dual preview</a>
      <a href="./freemium-app.html?preview=mobile" target="_blank" rel="noopener">Open app alone</a>
      <button type="button" id="btn-reload" title="Reload phone">Reload</button>
    </div>
  </header>
  <div class="stage">
    <div class="phone" aria-label="iPhone-sized freemium preview">
      <div class="phone-notch" aria-hidden="true"></div>
      <div class="phone-screen">
        <iframe
          id="freemium-frame"
          title="Harbor freemium mobile"
          src="./freemium-app.html?preview=mobile"
          allow="geolocation *; microphone *"
        ></iframe>
      </div>
    </div>
  </div>
  <p class="hint">
    <strong>Settings → Harbor Premium</strong> toggles free vs paid for review.
    Production stays at <strong>index.html</strong>.
  </p>
  <script>
    document.getElementById('btn-reload')?.addEventListener('click', function () {
      var frame = document.getElementById('freemium-frame');
      if (!frame) return;
      var base = './freemium-app.html?preview=mobile&t=' + Date.now();
      frame.src = base;
    });
  </script>
</body>
</html>
