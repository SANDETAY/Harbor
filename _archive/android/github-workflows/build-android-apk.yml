# Build a sideload-friendly debug APK (no Play signing required).
# Download: Actions → Build Android APK → latest run → Artifacts → Harbor-android-debug

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'native-www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/cap-prepare.sh'
      - '.github/workflows/build-android-apk.yml'

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Prepare web assets + Capacitor Android
        run: |
          bash scripts/cap-prepare.sh
          npx cap sync android
          # Ensure plugin bridge projects exist after sync
          ls -la android/
          test -f android/gradlew
          test -d android/app/src/main/assets/public

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses + install packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Point Gradle at Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          echo "Using SDK=$SDK"
          test -d "$SDK"
          printf 'sdk.dir=%s\n' "$SDK" > android/local.properties
          cat android/local.properties
          java -version

      - name: Build debug APK
        working-directory: android
        env:
          # Avoid interactive daemon issues in CI
          GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug --stacktrace --warning-mode all 2>&1 | tee /tmp/gradle-build.log
          # Always print tail so errors aren't buried
          echo "===== GRADLE TAIL ====="
          tail -n 100 /tmp/gradle-build.log

      - name: Surface Gradle log on failure
        if: failure()
        run: |
          echo '## Gradle failure log' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 /tmp/gradle-build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "===== FULL GRADLE LOG ====="
          cat /tmp/gradle-build.log || true

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Package APK
        run: |
          set -e
          echo "Looking for APK..."
          find android/app/build/outputs -type f -name '*.apk' -print || true
          APK=$(find android/app/build/outputs -type f -name '*debug*.apk' | head -1)
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs -type f -name '*.apk' | head -1)
          fi
          echo "Found: $APK"
          test -n "$APK" && test -f "$APK"
          cp "$APK" "Harbor-debug-378.apk"
          ls -lah Harbor-debug-378.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-android-debug
          path: Harbor-debug-378.apk
          retention-days: 14
