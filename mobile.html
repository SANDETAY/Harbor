<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Harbor · Mobile preview</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./harbor-favicon-32.png">
  <style>
    :root {
      --bezel: #081716;
      --frame: #122E2C;
      --accent: #2F9B8C;
      --muted: #8FA8A3;
      --bg: #0A1F1E;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(61, 154, 139, 0.12), transparent 55%),
        var(--bg);
      color: #F0EBE3;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.25rem;
    }
    #file-protocol-banner {
      display: none;
      width: min(390px, 100%);
      padding: 0.75rem 0.9rem;
      background: rgba(224, 122, 106, 0.12);
      border: 1px solid rgba(224, 122, 106, 0.35);
      border-radius: 0.85rem;
      color: #F0C4BC;
      font-size: 0.75rem;
      line-height: 1.45;
    }
    .bar {
      width: min(390px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .bar h1 {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .bar p {
      margin: 0.15rem 0 0;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .links {
      display: flex;
      gap: 0.45rem;
      flex-shrink: 0;
    }
    .links a, .links button {
      font: inherit;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(61, 154, 139, 0.35);
      background: rgba(61, 154, 139, 0.1);
      padding: 0.4rem 0.65rem;
      border-radius: 999px;
      cursor: pointer;
    }
    .links a:hover, .links button:hover { background: rgba(61, 154, 139, 0.18); }
    .phone {
      width: min(390px, 100%);
      height: min(844px, calc(100dvh - 6.5rem));
      min-height: 640px;
      border-radius: 2rem;
      padding: 0.55rem;
      background: linear-gradient(160deg, #2a3440, var(--bezel));
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 0.7rem;
      left: 50%;
      transform: translateX(-50%);
      width: 5.5rem;
      height: 0.35rem;
      border-radius: 999px;
      background: #0A1F1E;
      z-index: 2;
      opacity: 0.85;
    }
    .phone iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 1.55rem;
      background: #D6E8E2;
      display: block;
    }
    .note {
      width: min(390px, 100%);
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.4;
      text-align: center;
    }
    code {
      font-size: 0.62rem;
      color: #b7d4ce;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.1rem 0.3rem;
      border-radius: 0.3rem;
    }
  </style>
</head>
<body>
  <div id="file-protocol-banner" role="alert">
    <strong>Don’t open this as a file.</strong> Use
    <code>http://localhost:3000/mobile.html</code>
    after <code>npm start</code> (or <code>py -m http.server 3000</code>).
  </div>

  <div class="bar">
    <div>
      <h1>Mobile preview</h1>
      <p>Same app as <code>index.html</code> — forced phone frame.</p>
    </div>
    <div class="links">
      <button type="button" id="reload-btn">Reload</button>
      <a href="./index.html" target="_blank" rel="noopener">Web</a>
      <a href="./dual-preview.html" rel="noopener">Both</a>
    </div>
  </div>

  <div class="phone" aria-label="iPhone-sized Harbor preview">
    <iframe id="mobile-frame" title="Harbor mobile" allow="geolocation *; microphone *"></iframe>
  </div>

  <p class="note">
    Edit only <code>index.html</code>. Prefer
    <code>http://localhost:3000/dual-preview.html</code> for side-by-side checks.
  </p>

  <script>
    (function () {
      if (location.protocol === 'file:') {
        document.getElementById('file-protocol-banner').style.display = 'block';
      }
      var frame = document.getElementById('mobile-frame');
      function load() {
        frame.src = './index.html?preview=mobile&t=' + Date.now();
      }
      document.getElementById('reload-btn').addEventListener('click', load);
      load();
    })();
  </script>
</body>
</html>
