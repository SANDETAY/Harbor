<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="robots" content="noindex">
  <title>Rhythm · Mobile preview</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./rhythm-favicon-32.png">
  <style>
    :root {
      --bezel: #0c1014;
      --frame: #1a222b;
      --accent: #3d9a8b;
      --muted: #8a9aa3;
      --bg: #0a0e12;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 50% at 50% 0%, rgba(61, 154, 139, 0.12), transparent 55%),
        var(--bg);
      color: #e8eef0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.25rem;
    }
    .bar {
      width: min(390px, 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .bar h1 {
      margin: 0;
      font-size: 0.85rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    .bar p {
      margin: 0.15rem 0 0;
      font-size: 0.68rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .links {
      display: flex;
      gap: 0.45rem;
      flex-shrink: 0;
    }
    .links a {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(61, 154, 139, 0.35);
      background: rgba(61, 154, 139, 0.1);
      padding: 0.4rem 0.65rem;
      border-radius: 999px;
    }
    .links a:hover { background: rgba(61, 154, 139, 0.18); }
    .phone {
      width: min(390px, 100%);
      height: min(844px, calc(100vh - 6.5rem));
      border-radius: 2rem;
      padding: 0.55rem;
      background: linear-gradient(160deg, #2a3440, var(--bezel));
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(255, 255, 255, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      position: relative;
    }
    .phone::before {
      content: '';
      position: absolute;
      top: 0.7rem;
      left: 50%;
      transform: translateX(-50%);
      width: 5.5rem;
      height: 0.35rem;
      border-radius: 999px;
      background: #0a0e12;
      z-index: 2;
      opacity: 0.85;
    }
    .phone iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 1.55rem;
      background: #0f1419;
      display: block;
    }
    .note {
      width: min(390px, 100%);
      font-size: 0.65rem;
      color: var(--muted);
      line-height: 1.4;
      text-align: center;
    }
    code {
      font-size: 0.62rem;
      color: #b7d4ce;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.1rem 0.3rem;
      border-radius: 0.3rem;
    }
  </style>
</head>
<body>
  <div class="bar">
    <div>
      <h1>Mobile preview</h1>
      <p>Same app as <code>index.html</code> — forced phone frame for side‑by‑side checks.</p>
    </div>
    <div class="links">
      <a href="./index.html" target="_blank" rel="noopener">Web</a>
      <a href="./dual-preview.html" target="_blank" rel="noopener">Both</a>
    </div>
  </div>

  <div class="phone" aria-label="iPhone-sized Rhythm preview">
    <iframe
      src="./index.html?preview=mobile"
      title="Rhythm mobile"
      allow="geolocation; microphone"
    ></iframe>
  </div>

  <p class="note">
    Edit only <code>index.html</code> (one codebase). Refresh this page to re-check mobile.
    Full device testing still works best on a real phone via GitHub Pages or localhost.
  </p>
</body>
</html>
