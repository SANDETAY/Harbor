# FROZEN — website updates paused until Brittany explicitly unfreezes them.
# All active work is TestFlight / iOS app only. Do not re-enable push deploys
# without her go-ahead.
#
# Live site stays as last successful deploy. Manual run only if she asks.
name: Deploy GitHub Pages

on:
  # push to main DISABLED (website freeze)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Hard stop: even manual dispatch is blocked until freeze is lifted.
    # Change `if` to `true` (or remove it) only when Brittany unfreezes the website.
    if: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
