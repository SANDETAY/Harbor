# GitHub Pages deploy — DISABLED while the repo is private.
# Free GitHub accounts cannot deploy Pages from private repos (needs GitHub Pro).
# TestFlight / App Store do NOT use this workflow — archive in Xcode as usual.
#
# To re-enable later (public repo or paid plan): restore the `push: branches: [main]` trigger.

name: Deploy GitHub Pages

# Manual only — will not run on push (no more failure emails)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: false  # hard-off until you intentionally re-enable Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
