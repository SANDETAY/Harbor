# Build a sideload-friendly debug APK (no Play signing required).
# Run manually: Actions → Build Android APK → Run workflow
# Download the APK from the run's Artifacts.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'native-www/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/cap-prepare.sh'
      - '.github/workflows/build-android-apk.yml'

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Prepare web assets + Capacitor Android
        run: |
          bash scripts/cap-prepare.sh
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"
          cp "$APK" "Harbor-debug-378.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-android-debug
          path: Harbor-debug-378.apk
          retention-days: 14
